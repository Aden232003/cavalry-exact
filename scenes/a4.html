<script>
(function(){
const DUR=6.5, F0=361, F1=516;
const host=document.getElementById("a4-frames");
const tl=gsap.timeline({paused:true});

/* ---------------- styles ---------------- */
const ST={ // tile bg, glyph colour
  tn:["#C9AA80","#1C231C"], tl:["#CDB592","#1C231C"], rb:["#B98F74","#1E221C"], br:["#B07C52","#161A15"],
  yl:["#CEC19E","#1C231C"], pl:["#DAD9CF","#3A7254"], py:["#D4C9A5","#3A664B"], tn2:["#C29C73","#1A1F19"],
  bl:["#2D5A97","#D9D6EA"]
};
const GST={"嘢":"rb","歴":"yl","賣":"tl","專":"tl","無":"pl","雙":"pl","十":"br","舊":"pl","禾":"pl","正":"pl",
  "餘":"tn","六":"br","養":"pl","滋":"pl","年":"tn","米":"pl","靚":"tn2","神":"pl","史":"py","酒":"pl","嘉":"pl"};
function filt(fs){ if(fs<34) return ""; if(fs<80) return "url(#a4-b1)"; if(fs<150) return "url(#a4-b2)"; if(fs<250) return "url(#a4-b3)"; if(fs<380) return "url(#a4-b4)"; return "url(#a4-b5)"; }
function glyph(ch,fs,col,extra){
  let inner=ch;
  if(ch==="嘢"){ inner='<span class="a4-cmp"><i style="width:.3em;transform:scale(.42,.5) translateY(-.2em)">口</i><i style="width:.72em;transform:scaleX(.76)">野</i></span>'; }
  return '<div class="a4-g" style="font-size:'+fs.toFixed(1)+'px;color:'+col+';filter:'+filt(fs)+';'+(extra||"")+'">'+inner+'</div>';
}
// generic glyph tile: cx,cy centre, w,h size, rot deg, glyph, style key
function tile(cx,cy,w,h,g,sk,rot,o){
  o=o||{}; sk=sk||GST[g]||"tn"; const s=ST[sk];
  const m=Math.min(w,h); const fs=m*(o.gs||0.8);
  let st='left:'+(cx-w/2).toFixed(1)+'px;top:'+(cy-h/2).toFixed(1)+'px;width:'+w.toFixed(1)+'px;height:'+h.toFixed(1)+'px;background-color:'+(o.bg||s[0])+';';
  if(rot) st+='transform:rotate('+rot.toFixed(2)+'deg);';
  if(o.z) st+='z-index:'+o.z+';';
  return '<div class="a4-t" style="'+st+'">'+(g?glyph(g,fs,o.col||s[1]):"")+'</div>';
}
function rect(x0,y0,x1,y1,bg,extra){ return '<div class="a4-rect" style="left:'+x0.toFixed(1)+'px;top:'+y0.toFixed(1)+'px;width:'+(x1-x0).toFixed(1)+'px;height:'+(y1-y0).toFixed(1)+'px;background:'+bg+';'+(extra||"")+'"></div>'; }
// svg helpers
function rh(x,y,r){ r=r||7.5; return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r+'" fill="#fff" stroke="#D0121A" stroke-width="3.2"/>'; }
function bh(x,y){ return '<rect x="'+(x-4.5).toFixed(1)+'" y="'+(y-4.5).toFixed(1)+'" width="9" height="9" fill="#141414"/>'; }
function poly(pts,stroke,sw,close,extra){ return '<'+(close===false?'polyline':'polygon')+' points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="none" stroke="'+stroke+'" stroke-width="'+sw+'" '+(extra||"")+'/>'; }
function line(a,b,stroke,sw){ return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>'; }
function svg(inner){ return '<svg class="a4-svg" viewBox="0 0 1080 1080" style="z-index:50">'+inner+'</svg>'; }
function hull(P){ P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[]; for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(let i=P.length-1;i>=0;i--){const p=P[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  up.pop();lo.pop();return lo.concat(up);}
const lerp=(a,b,u)=>a+(b-a)*u;
function interpKeys(K,f){ // K: {frame: obj} with numeric arrays; returns lerped copy when structure matches
  const ks=Object.keys(K).map(Number).sort((a,b)=>a-b);
  if(K[f]) return K[f];
  let a=ks[0],b=ks[ks.length-1]; for(const k of ks){ if(k<=f) a=k; if(k>=f){b=k;break;} }
  const A=K[a],B=K[b]; if(a===b) return A;
  const u=(f-a)/(b-a);
  const same=JSON.stringify(A,(k,v)=>typeof v==="number"?0:v)===JSON.stringify(B,(k,v)=>typeof v==="number"?0:v);
  if(!same) return A;
  const rec=(x,y)=>Array.isArray(x)?x.map((v,i)=>rec(v,y[i])):(typeof x==="number"?lerp(x,y,u):(x&&typeof x==="object"?Object.fromEntries(Object.keys(x).map(k=>[k,rec(x[k],y[k])])):x));
  return rec(A,B);
}

/* ================= S1: ring of tiles (361-380) ================= */
const RS={"恒":"#E2D8C6","民":"#D3D2DD","安":"#DAD7D0","富":"#D0D5DC","長":"#D9D8D3","平":"#D2D2D0","建":"#CDD3DC","泰":"#D0D6DE","興":"#CED4DC","芳":"R","宏":"R","學":"R"};
const S1={
361:{D:226,t:[["恒",377,393],["民",325,600],["安",565,317],["芳",738,433],["宏",738,640]]},
362:{D:238,t:[["恒",330,455],["民",362,678],["安",508,319],["芳",716,400],["宏",748,622]]},
363:{D:250,t:[["建",315,508],["平",409,724],["富",468,320],["長",702,378],["學",757,605]]},
364:{D:256,t:[["恒",340,422],["平",396,721],["安",628,326],["學",764,594]]},
365:{D:250,t:[["恒",326,447],["平",426,741],["安",608,316],["學",765,583]]},
366:{D:254,t:[["建",316,470],["平",454,756],["安",590,312],["學",770,573]]},
367:{D:268,t:[["富",461,319],["平",377,705],["學",771,563]]},
368:{D:268,t:[["恒",449,323],["泰",391,719],["芳",775,556]]},
369:{D:268,t:[["恒",438,328],["泰",402,729],["芳",774,549]]},
370:{D:268,t:[["恒",430,332],["泰",411,738],["芳",775,543]]},
371:{D:270,t:[["泰",305,539],["芳",775,539]]},
372:{D:270,t:[["泰",304,541],["芳",774,537]]}
};
const PAIR={373:[235,-2.3,272],374:[235,-3.7,268],375:[232,-5,264],376:[232,-7.5,260],377:[225,-10.2,250],378:[218,-14.6,234],379:[206,-21.5,208],380:[172,-56,150]};
for(const f in PAIR){ const [d,a,D]=PAIR[f]; const r=a*Math.PI/180; S1[f]={D:D,t:[["興",540-d*Math.cos(r),540-d*Math.sin(r)],["長",540+d*Math.cos(r),540+d*Math.sin(r)]]}; }
function ringTile(g,cx,cy,s){
  const red=RS[g]==="R"; const bg=red?"#CF442B":RS[g];
  const fs=s*0.84; const cd=s*0.9;
  let h='<div class="a4-t" style="left:'+(cx-s/2).toFixed(1)+'px;top:'+(cy-s/2).toFixed(1)+'px;width:'+s+'px;height:'+s+'px;background-color:'+bg+';box-shadow:inset 0 0 0 1.5px rgba(40,40,50,.28)">';
  h+=glyph(g,fs,"#131313");
  if(!red) h+=glyph(g,fs,"#1C6CAB","clip-path:circle("+(cd/2-2)+"px at 50% 50%)");
  h+='<div class="a4-circ" style="left:'+((s-cd)/2)+'px;top:'+((s-cd)/2)+'px;width:'+cd+'px;height:'+cd+'px;border:5px solid #D11818"></div>';
  return h+'</div>';
}
function buildS1(f){
  const d=S1[f]; const s=208; let h="";
  const P=[];
  for(const [g,x,y] of d.t){ h+=ringTile(g,x,y,s); P.push([x-s/2,y-s/2],[x+s/2,y-s/2],[x-s/2,y+s/2],[x+s/2,y+s/2]); }
  h+='<div class="a4-circ" style="left:'+(540-d.D/2)+'px;top:'+(540-d.D/2)+'px;width:'+d.D+'px;height:'+d.D+'px;border:6px solid #D11818;z-index:40"></div>';
  const H=hull(P); let sv=poly(H,"#222",1.5); for(const p of H) sv+=rh(p[0],p[1]);
  return h+svg(sv);
}

/* ================= S2: vertical stacks (381-408) ================= */
// tiles: [glyph, cy, w, h]  (cx=540); bb:[x0,y0,x1,y1]; gh: ghost rect
const S2={

382:{t:[["嘢",390,260,260],["賣",538,10,10],["歴",688,260,258]],bb:[380,260,700,816]},

394:{t:[["嘢",354,240,228],["賣",538,60,60],["歴",712,240,240]],bb:[368,192,712,882]},
395:{t:[["嘢",351,190,190],["無",496,80,80],["雙",586,80,80],["歴",727,190,190]],bb:[368,186,710,892]},
396:{t:[["賣",312,206,204],["無",472,106,104],["雙",606,106,104],["專",766,206,204]],bb:[374,168,702,910]},

398:{t:[["賣",285,212,210],["無",459,110,110],["十",538,48,48],["雙",619,110,110],["專",794,212,212]],bb:[384,120,696,960],gh:[356,80,724,992]},

};
function buildS2(f){
  const d=interpKeys(S2,f); let h="";
  for(const [g,cy,w,hh] of d.t) h+=tile(540,cy,w,hh,g,null,0,{gs:0.8});
  const [x0,y0,x1,y1]=d.bb; let sv="";
  if(d.gh){ const [a,b,c,e]=d.gh; sv+=poly([[a,b],[c,b],[c,e],[a,e]],"rgba(120,120,120,.28)",3); }
  sv+=poly([[x0,y0],[x1,y0],[x1,y1],[x0,y1]],"#3d3d3d",1.4);
  const mx=(x0+x1)/2,my=(y0+y1)/2; sv+=bh(mx,y0)+bh(mx,y1)+bh(x0,my)+bh(x1,my);
  sv+=rh(x0,y0)+rh(x1,y0)+rh(x0,y1)+rh(x1,y1);
  return h+svg(sv);
}

/* ================= S3: cross / plus (409-431) ================= */
// A arm size, Ra arm centre distance, c centre block, r inner radius, si inner size, phi ring rot, sq red square size
const S3={
409:{A:236,Ra:204,c:172,r:43,si:36,phi:0,sq:12},
410:{A:236,Ra:223,c:210,r:64,si:56,phi:0,sq:20},
411:{A:236,Ra:227,c:218,r:72,si:64,phi:0,sq:22},
412:{A:236,Ra:229,c:222,r:74,si:66,phi:0,sq:22},
416:{A:236,Ra:233,c:230,r:76,si:68,phi:0,sq:22},
423:{A:236,Ra:237,c:238,r:79,si:70,phi:0,sq:22},
424:{A:232,Ra:235,c:238,r:79,si:70,phi:0,sq:22},
425:{A:218,Ra:225,c:232,r:77,si:70,phi:8,sq:22},
426:{A:206,Ra:217,c:228,r:75,si:72,phi:28,sq:22},
427:{A:196,Ra:219,c:200,r:79,si:78,phi:45,sq:22},
428:{A:186,Ra:224,c:170,r:94,si:92,phi:45,sq:22},
429:{A:173,Ra:230,c:120,r:106,si:104,phi:45,sq:20},
430:{A:156,Ra:248,c:0,r:118,si:124,phi:45,sq:0},
431:{A:120,Ra:280,c:0,r:176,si:186,phi:45,sq:0}
};
function buildS3(f){
  const d=interpKeys(S3,f); const late=f>=423;
  const arms=late?["十","養","滋","年"]:["專","舊","禾","嘢"]; // top,left,right,bottom
  const inn=late?["舊","嘢","六","米"]:["無","餘","六","正"];
  let h=""; const {A,Ra,c,r,si,phi,sq}=d;
  const ac=[[540,540-Ra],[540-Ra,540],[540+Ra,540],[540,540+Ra]];
  for(let i=0;i<4;i++) h+=tile(ac[i][0],ac[i][1],A,A,arms[i],null,0,{gs:0.8});
  if(c>1) h+=rect(540-c/2,540-c/2,540+c/2,540+c/2,"#F4F4F2","z-index:5");
  const ang=[-90,180,0,90]; const p=phi*Math.PI/180;
  for(let i=0;i<4;i++){ const a=ang[i]*Math.PI/180+p; h+=tile(540+r*Math.cos(a),540+r*Math.sin(a),si,si,inn[i],null,phi,{gs:0.8,z:6}); }
  let sv="";
  if(sq>0) sv+='<rect x="'+(540-sq/2)+'" y="'+(540-sq/2)+'" width="'+sq+'" height="'+sq+'" fill="#F7F7F5" stroke="#D0121A" stroke-width="2"/>';
  const e=Ra+A/2, w=A/2;
  const oc=[[540-w,540-e],[540+w,540-e],[540+e,540-w],[540+e,540+w],[540+w,540+e],[540-w,540+e],[540-e,540+w],[540-e,540-w]];
  if(f<=430){ sv+=poly(oc,"#8a8a8a",1.2); for(const q of oc) sv+=rh(q[0],q[1]); }
  else sv+=poly(oc,"rgba(170,170,170,.8)",2.5);
  return h+svg(sv);
}

/* ================= S4: rotated diagonal board (432-441) ================= */
// C cell, ai inner size, th rotation, g:[A.TL,A.BR,B.TL,B.BR], mini:[left,right] m size, off:[dx,dy]
const S4={
432:{C:226,ai:0,th:-45,g:["專",null,null,"舊"],mini:["嘢","史"],m:151},
433:{C:354,ai:40,th:-45,g:["專","嘢","米","舊"],mini:["嘢","史"],m:150},
434:{C:382,ai:108,th:-45,g:["賣","六","舊","雙"],mini:["嘢","史"],m:150},
435:{C:396,ai:160,th:-45,g:["年","六","養","米"]},
436:{C:418,ai:205,th:-45,g:["年","六","養","米"]},
437:{C:438,ai:240,th:-45,g:["年","六","養","米"]},
438:{C:453,ai:262,th:-45,g:["六","餘","餘","六"]},
439:{C:480,ai:283,th:-44,g:["六","餘","餘","六"],rx:6},
440:{C:505,ai:307,th:-41,g:["六","餘","餘","六"],rx:10,ry:-6},
441:{C:480,ai:315,th:-30,g:["六","餘","餘","六"],rx:8,ry:-6,off:[-45,-55],fill:"餘"}
};
function buildS4(f){
  const d=S4[f]; const {C,ai,th}=d; const ao=C-ai; let b="";
  const G=d.g; const pale="#DCDCDA";
  // pale sub-cells
  if(ai>0){
    const pc=[[-ai,-C,0,-ai],[-C,-ai,-ai,0],[ai,0,C,ai],[0,ai,ai,C]]; // A.TR, A.BL, B.TR, B.BL  [x0,y0,x1,y1]
    for(const q of pc){ if(d.fill){ const w=q[2]-q[0],hh=q[3]-q[1]; b+=tile((q[0]+q[2])/2,(q[1]+q[3])/2,w,hh,d.fill,"pl",0,{gs:0.8}); } else b+=rect(q[0],q[1],q[2],q[3],pale); }
    b+=tile(-C+ao/2,-C+ao/2,ao,ao,G[0],null,0,{gs:0.8});
    b+=tile(-ai/2,-ai/2,ai,ai,G[1],null,0,{gs:0.8});
    b+=tile(ai/2,ai/2,ai,ai,G[2],null,0,{gs:0.8});
    b+=tile(ao/2+ai,ao/2+ai,ao,ao,G[3],null,0,{gs:0.8});
  } else {
    b+=tile(-C/2,-C/2,C,C,G[0],null,0,{gs:0.8});
    b+=tile(C/2,C/2,C,C,G[3],null,0,{gs:0.8});
