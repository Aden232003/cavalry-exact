<script>(function(){
const DUR=5.667, T0=116/24;
const $=id=>document.getElementById(id);
function mk(tag,cls,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(parent)parent.appendChild(e);return e;}
// seeded rng
function hash(n){n=(n|0)^0x9e3779b9;n=Math.imul(n^(n>>>16),0x85ebca6b);n=Math.imul(n^(n>>>13),0xc2b2ae35);return ((n^(n>>>16))>>>0)/4294967296;}

function step(list,f){let v=list[0][1];for(const e of list){if(f>=e[0])v=e[1];else break;}return v;}

/* ================= A: dark feedback slit-scan (frames 117-157) ================= */
const CYC=['念','紀','留','垂','永','誌','不','忘'];

function glyphA(f){if(f>=149)return'不';if(GA[f])return GA[f];const n=117-f;return CYC[((2-Math.ceil(n/3))%8+8)%8];}
const SH=['#1e1e21','#242427','#2b2c30','#35363c','#41434a','#28292d'];
function shadeA(f){return SH[Math.floor(hash(f*31+7)*SH.length)];}
const K=18;
function mkTun(el){const L=[];for(let k=0;k<K;k++){const c=mk('div','a2-card',el);c.style.zIndex=K-k;const g=mk('span','a2-cg',c);L.push({c,g,last:''});}return L;}

// spiral keyframes (frames 120-125): card + feedback map (scale g, rot r, anchor rel ax/ay)
const AKF=[

/* ================= B: white pinwheel lattice (frames 158-175) ================= */

function renderB(ff,f){const p=kf(LKF,ff);const s=p.P/142;

/* ================= C: aged collage, Droste grid -> columns (frames 176-252) ================= */
const PAP=['#e6d9b8','#ecdfc2','#e0d1ac','#d9c9a2','#efe4c9','#e3d4b0'];

const RING=[0,1,2,3,4,7,8,11,12,13,14,15];
const cellsByIdx={};RING.forEach(i=>cellsByIdx[i]=[]);
const holes=[];
seed=777;
function mkCell(parent,x,y,list){const c=mk('div','a2-cell',parent);c.style.left=x+'px';c.style.top=y+'px';
  const p=mk('div','a2-pap',c);const px=-8+rng()*16,py=-8+rng()*16,pw=252+rng()*30,ph=252+rng()*30;

  const d=mk('div','a2-disc',c);const dd=214+rng()*20;d.style.width=d.style.height=dd+'px';d.style.left=(135-dd/2+(-8+rng()*16))+'px';d.style.top=(135-dd/2+(-8+rng()*16))+'px';
  const g=mk('span','a2-g',c);const o={c,d,g,lg:'',lc:''};if(list)list.push(o);return o;}
function mkGrid(parent,level){const G=mk('div','a2-grid',parent);const cells={};
  RING.forEach(i=>{const r=Math.floor(i/4),q=i%4;const o=mkCell(G,q*270,r*270,cellsByIdx[i]);o.col=q;o.row=r;cells[i]=o;});

const CK=[
 [176,'王r 少b 封g 伯g 游g 權r 森g 永b 泉b 宗r 義g 鑑g'],
