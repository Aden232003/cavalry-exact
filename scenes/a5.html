    ['#a5-bar','#a5-cross','#a5-shan'].forEach(function(h){ var sv=document.createElementNS(NS,'svg'); sv.setAttribute('viewBox','-50 -50 100 100'); var u=document.createElementNS(NS,'use'); u.setAttribute('href',h); u.setAttribute('x','-50');u.setAttribute('y','-50');u.setAttribute('width','100');u.setAttribute('height','100'); u.setAttribute('fill','currentColor'); sv.appendChild(u); d.appendChild(sv); });
    parent.appendChild(d); d._k=-1; return d;
  }
  function setKind(d,k){ if(d._k===k)return; d._k=k; for(var i=0;i<3;i++) d.children[i].style.visibility=(i===k)?'visible':'hidden'; }
  var NA=10, NJ=8, F4=[], r4=rng(571);
  for(var j=0;j<NJ;j++) for(var i=0;i<NA;i++){ F4.push({j:j,i:i,rr:r4(),ra:r4(),rs:r4(),rg:r4(),w:frag(p4w),g:frag(p4g)}); }
  var CT=[]; for(k=0;k<4;k++){ var cd=frag(p4c); cd.style.color='#58ABDF'; CT.push(cd); }
  var CX=xin(p4c); CX.style.color='#58ABDF';
  var G4=1.45, R4=118;
  function uOf(t){ var tt=t-2.25; return 0.3+tt*0.32 + 0.9*(1-Math.exp(-tt*5)); }
  function twist(t){ var tt=t-2.25; return 75*Math.exp(-tt*8)+4; }
  function sweep1(th,r){ var a=((th+60)%360+360)%360; return 2.74+0.09*a/360+0.04*Math.max(0,1-r/420); }
  function sweep2(th,r){ var a=((th+60)%360+360)%360; return 3.40+0.17*a/360+0.03*Math.max(0,1-r/380); }
  function r4f(t){
    var tt=t-2.25, u=uOf(t), tw=twist(t), grot=-5*tt;
    for(var k=0;k<NR;k++){
      var a=(k*15+3+grot*0.6)*D2R, r0=(k%3==0?44:(k%3==1?70:56));
      setLine(RAYS[k],C+r0*Math.cos(a),C+r0*Math.sin(a),C+1000*Math.cos(a),C+1000*Math.sin(a));
      for(var m=0;m<ND;m++){
        var dd=DOTS[k*ND+m], du=m+((tt*0.8+k*0.37)%1), dr=70*Math.pow(1.3,du)+(k%2)*12;
        dd.setAttribute('cx',(C+dr*Math.cos(a)).toFixed(2)); dd.setAttribute('cy',(C+dr*Math.sin(a)).toFixed(2));
        dd.style.display=(dr>r0+4&&dr<900)?'':'none';
      }
    }
    for(var q=0;q<F4.length;q++){
      var e=F4[q], ring=((e.j+u)%NJ), r=R4*Math.pow(G4,ring);
      var th=e.i*(360/NA)+(e.j%2)*18+(e.ra-0.5)*12 + tw*ring + grot;
      var kind = t<sweep1(th,r)?0:(t<sweep2(th,r)?1:2);
      var size=(0.18*r+42)*(1+0.22*(e.rs-0.5));
      var x=C+r*Math.cos(th*D2R), y=C+r*Math.sin(th*D2R), rot;
      if(kind===0) rot=th+35+(e.rr-0.5)*30+tw*0.6;
      else if(kind===1) rot=(e.rr-0.5)*46+th*0.12;
      else rot=th-90+(e.rr-0.5)*40;
      var sc=size/100*(kind===0?1.3:(kind===1?1.08:1.05));
      setKind(e.w,kind); setKind(e.g,kind);
      var op=Math.max(0,Math.min(1,(r-R4-8)/30));
      place(e.w,x,y,rot,sc,null,op);
      var gth=th-9-e.rg*6, gr=r*1.12;

    }
    var ck = t<2.79?0:(t<3.575?1:2), n=t*24;
    for(k=0;k<4;k++){ setKind(CT[k],ck===0?-2:ck); }
    CX.style.opacity=ck===0?1:0; place(CX,C,C,0,0.36,null,ck===0?1:0);
    if(ck===0){ for(k=0;k<4;k++)CT[k].style.opacity=0; }
    else if(ck===1){ place(CT[0],C,C,0,0.5+0.1*Math.min(1,(t-2.79)/0.5),null,1); for(k=1;k<4;k++)CT[k].style.opacity=0; }
    else {
      var gsc=kf([[86,0.72],[93,0.86],[96,0.95]],n);
      if(n<96.5){ place(CT[0],C,C,0,gsc,null,1); for(k=1;k<4;k++)CT[k].style.opacity=0; }
      else if(n<97.5){ place(CT[0],C,C+4,0,.9,null,1); place(CT[1],C-36,C+4,0,.9,null,1); place(CT[2],C+36,C+4,0,.9,null,1); CT[3].style.opacity=0; }
      else { place(CT[0],C-44,C-38,0,.95,null,1); place(CT[1],C+44,C-38,0,.95,null,1); place(CT[2],C-44,C+34,0,.95,null,1); place(CT[3],C+44,C+34,0,.95,null,1); }
    }
  }

  /* ---------------- P5 ---------------- */
  var p5=$('a5-p5'), grid=$('a5-grid'), sqG=$('a5-p5-sq');
  var SEQ=['仙','師','實','誥','志','心','敢','命','禮','玉','清','内','相','金'];
  var EXT=['閣','化','選','身','三','教','為','之','法','掌','雷','五','判','黃','令'];
  var CELLS=[], r5=rng(616), CS=89;
  for(var jj=-7;jj<=6;jj++) for(var ii=-7;ii<=6;ii++){
    var d=document.createElement('div'); d.className='a5-cell'; d.style.left=(C+ii*CS)+'px'; d.style.top=(C+jj*CS)+'px';
    var b=document.createElement('b'), s=document.createElement('s'), gi=document.createElement('i');
    d.appendChild(b); d.appendChild(s); d.appendChild(gi); grid.appendChild(d);
    CELLS.push({d:d,b:b,s:s,g:gi,r:Math.hypot(ii+.5,jj+.5),ii:ii,jj:jj,rv:r5(),rv2:r5(),ch:'',st:''});
  }
  var SQ=[]; for(k=0;k<6;k++) SQ.push(mk('rect',sqG)); var SQL=[]; for(k=0;k<4;k++) SQL.push(mk('line',sqG));
  var GS=[[99,.93],[100,.94],[101,.96],[102,.98],[103,.99],[104,1]];
  var RB=[[99,1.1],[100,1.3],[101,1.9],[102,2.3],[103,2.75],[104,3.0],[105,3.3],[106,3.6],[107,3.95],[108,4.15],[109,4.35],[110,4.45],[111,4.55],[113,4.65],[115,4.75],[117,4.9],[119,5.05],[120,5.15],[121,5.3],[122,5.45],[123,5.65],[124,5.95],[125,6.35],[126,6.9],[127,7.5],[128,8.3],[129,12]];
  var RIN=[[99,0],[101.4,0],[101.6,1.2],[125,1.2],[126,1.3]];
  var RCI=[[99,0],[106.4,0],[106.6,1.75],[108,2.0],[109,2.3],[112,2.7],[121,3.3],[124,3.6],[127,4.1],[128,4.5],[130,5.0],[133,5.3],[133.4,5.3],[133.6,12]];
  var REM=[[125,0],[126,0.9],[127,1.65],[128,1.95],[129,2.2],[130,2.45],[131,2.85],[132,3.2],[133,4.5],[134,4.6]];
  var PD=[[99,3.3],[103,3.7],[109,6.0],[115,6.3],[118,5.5],[121,4.4],[124,4.5]];
  var PB=[[99,1],[100,5],[101,7],[103,9],[106,11.5],[109,13.4],[115,13.4],[121,13],[124,12.5],[128,12]];
  var PC=[[106,11],[109,12],[112,11],[115,8],[118,7],[121,5.2],[124,4],[127,3],[131,2.4],[134,2]];
  function pick(arr,i){ i=Math.round(i); if(i<0)i=0; if(i>arr.length-1)i=arr.length-1; return arr[i]; }
  function r5f(t){
    var n=t*24, gs=kf(GS,n); grid.style.transform='scale('+gs+')';
    var rb=kf(RB,n), rin=kf(RIN,n), rci=kf(RCI,n), rem=kf(REM,n), pd=kf(PD,n), pb=kf(PB,n), pc=kf(PC,n);
    for(var q=0;q<CELLS.length;q++){
      var c=CELLS[q], r=c.r, st, ch, blueA=0;
      var inBlue = r<rb, inHole = r<rin, inCirc = r<rci && !inHole;
      if(!inBlue && !(n>=133.5)) { st='d'; ch = (n>=123 && r>6.3)? EXT[Math.floor(c.rv*6)] : pick(SEQ, pd+1.45*(r-5)); }
      else if(inHole || (r<rem)) { st='h'; ch = pick(SEQ, pc-0.6); }
      else if(inCirc) { st='c'; ch = pick(SEQ, pc+1.6*(r-1.58)); }
      else { st='b'; blueA=Math.min(1,Math.max(0.12,(rb-r)/2.0));
        ch = ((n>=125 && r>rci+0.9)||(n>=118 && r>rci+1.6))? EXT[Math.floor((r*1.7+c.rv*2+n*0.5))%EXT.length] : pick(SEQ, pb-2.1*(r-1.58)); }
      var empty = (r<rem) || (n>=132.5 && c.rv2<(n>=133.5?0.62:0.5) && r>=rem);
      var key=st+(empty?'e':'')+Math.round(blueA*20);
      if(key!==c.st){ c.st=key;
        if(st==='b'){ c.b.style.background='rgba(24,90,172,'+(0.3+0.7*blueA).toFixed(3)+')'; c.b.style.boxShadow='inset 0 0 0 1.2px rgba(70,175,225,.85)'; c.s.style.display=(n>=132.5)?'block':'none'; }
        else if(st==='c'){ c.b.style.background='rgba(12,34,66,.95)'; c.b.style.boxShadow='inset 0 0 0 1.2px rgba(70,175,225,.6)'; c.s.style.display='block'; }
        else if(st==='h'){ c.b.style.background= (n>=127? 'rgba(14,19,24,1)':'rgba(13,22,26,.9)'); c.b.style.boxShadow= (n>=127?'none':'inset 0 0 0 1px rgba(70,175,225,.35)'); c.s.style.display=(r>=rem-0.45&&r<rem+0.05&&n>=127)?'block':'none'; }
        else { c.b.style.background='transparent'; c.b.style.boxShadow='none'; c.s.style.display='none'; }
        c.g.style.opacity = empty?0:(st==='h'?(n<126?0.85:0):1);
      }

    var sz=kf([[127.5,0],[128,60],[129,80],[130,96],[131,104],[132,116],[133,140],[134,200]],n);
    for(var k=0;k<SQ.length;k++) SQ[k].style.display='none'; for(k=0;k<SQL.length;k++) SQL[k].style.display='none';
    if(n>=127.5){
      var h=sz/2; SQ[0].style.display=''; SQ[0].setAttribute('x',C-h);SQ[0].setAttribute('y',C-h);SQ[0].setAttribute('width',sz);SQ[0].setAttribute('height',sz);
      if(n>=130.5 && n<132.5){ var h2=h-7; SQ[1].style.display=''; SQ[1].setAttribute('x',C-h2);SQ[1].setAttribute('y',C-h2);SQ[1].setAttribute('width',2*h2);SQ[1].setAttribute('height',2*h2); }
      if(n>=131.5 && n<132.5){ setLine(SQL[0],C-h,C-h+12,C+h,C-h+12); setLine(SQL[1],C-h+12,C-h,C-h+12,C+h); SQL[0].style.display='';SQL[1].style.display=''; }
      if(n>=132.5 && n<133.5){ setLine(SQL[0],C-h/3,C-h,C-h/3,C+h); setLine(SQL[1],C+h/3,C-h,C+h/3,C+h); setLine(SQL[2],C-h,C-h/3,C+h,C-h/3); setLine(SQL[3],C-h,C+h/3,C+h,C+h/3); for(k=0;k<4;k++)SQL[k].style.display=''; }
      if(n>=133.5){ setLine(SQL[0],C,C-h,C,C+h); setLine(SQL[1],C-h,C,C+h,C); SQL[0].style.display='';SQL[1].style.display=''; }
    }
  }

  /* ---------------- master ---------------- */
  var LAYERS=[p1,p2,p3,p4,p5], cur=-1;

  }

  render(0);
  var tl=gsap.timeline({paused:true});
  tl.to(proxy,{t:DUR,duration:DUR,ease:'none',onUpdate:function(){render(proxy.t);}},0);
  tl.set({},{},DUR);
  window.__timelines=window.__timelines||{};
  window.__timelines["a5"]=tl;
})();</script>
