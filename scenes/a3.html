const DUR=4.5, NS="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function set(e,attrs){for(const k in attrs)e.setAttribute(k,attrs[k]);}
function show(e,v){e.setAttribute("display",v?"inline":"none");}
function rng(seed){let s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function kf(keys,t){if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const a=keys[i-1],b=keys[i];const p=(t-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*p;}}return keys[keys.length-1][1];}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const INK="#111";

// ---------- convex hull of circles ----------
function circleHull(cs,N){N=N||96;const pts=[];cs.forEach((c,ci)=>{for(let k=0;k<N;k++){const a=2*Math.PI*k/N;pts.push([c.x+c.R*Math.cos(a),c.y+c.R*Math.sin(a),ci]);}});
 pts.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
 const lo=[],up=[];for(const p of pts){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
 for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
 lo.pop();up.pop();return lo.concat(up);}
// draws hull into a "hull widget" {fill, arcs(path), sq[]}
function makeHullWidget(parent,fill){const w={};w.fill=el("path",{fill:fill},parent);w.cg=el("g",{},parent);w.arcs=el("path",{fill:"none",stroke:INK,"stroke-width":5},parent);w.sq=[];for(let i=0;i<16;i++)w.sq.push(el("rect",{width:5,height:5,fill:INK,display:"none"},parent));return w;}
function drawHull(w,cs){const h=circleHull(cs);let d="M"+h.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join("L")+"Z";w.fill.setAttribute("d",d);
 // rotate so index 0 begins a run
 let s=0;for(let i=0;i<h.length;i++){if(h[i][2]!==h[(i-1+h.length)%h.length][2]){s=i;break;}}
 const H=h.slice(s).concat(h.slice(0,s));let ad="",sqi=0;let run=[H[0]];
 const flush=()=>{if(run.length>=3){ad+="M"+run.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join("L");}};
 for(let i=1;i<=H.length;i++){const p=H[i%H.length],q=H[i-1];if(i<H.length&&p[2]===q[2]){run.push(p);}else{flush();
   if(sqi<w.sq.length){const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;const L=Math.hypot(p[0]-q[0],p[1]-q[1]);if(L>6){set(w.sq[sqi],{x:(mx-2.5).toFixed(1),y:(my-2.5).toFixed(1)});show(w.sq[sqi],true);sqi++;}}
   run=[p];}}
 for(;sqi<w.sq.length;sqi++)show(w.sq[sqi],false);w.arcs.setAttribute("d",ad||"M0,0");}

// ================= LENS =================
const gLens=$("a3-g-lens");

const clipC=$("a3-lensclipc");
gLens.appendChild(lensW.arcs);lensW.sq.forEach(s=>gLens.appendChild(s));
const RC=[[0.125,42],[0.167,62],[0.208,75.5],[0.25,82],[0.292,86.5],[0.333,90.5],[0.375,93.5],[0.417,95.5],[0.458,97.5],[0.5,102],[0.542,108.5],[0.583,118.5],[0.625,133.5],[0.667,150]];

const GF=[[0.125,1.05],[0.208,1.7],[0.375,1.65],[0.458,1.5],[0.667,1.4]];

function renderLens(t){const on=t>=0.104&&t<0.646;show(gLens,on);if(!on)return;

 const cs=[{x:270-D,y:cy,r:rs},{x:270,y:cy,r:rc},{x:270+D,y:cy,r:rs}];

 set(lensTB,{x:270,y:cy+off+fs*0.8,"font-size":fs.toFixed(1)});lensTB.textContent="之";show(lensTB,t>=0.55);
}

// ================= CONTAINERS =================
const gCont=$("a3-g-cont");
const contW=makeHullWidget(gCont,"#F9AF00");
const contG=el("g",{filter:"url(#a3-brush2)"},gCont);
gCont.appendChild(contW.arcs);contW.sq.forEach(s=>gCont.appendChild(s));
const contCs=[],contTs=[];

// keys: t, dx, cols [L,C,R] y-lists, glyphs [L,C,R] strings, cut:true => no interpolation from previous
const CK=[
 {t:0.646,dx:75,c:[[237,302],[172,237,302,367],[237,302]],g:["種則","外不則多","雀昜"]},
 {t:0.708,dx:70,c:[[237,302],[166,236,303,373],[237,302]],g:["種則","外不則多","雀昜"]},
 {t:0.729,dx:66,c:[[238,301],[165,237,301,373],[238,301]],g:["無則","之昜則文","外昜"],cut:1},
 {t:0.8125,dx:63,c:[[238,300],[165,238,300,374],[238,300]],g:["無則","之昜則文","外昜"]},
 {t:0.8125,dx:65,c:[[200,262,325],[160,232,300,375],[200,265,325]],g:["字無則","之昜則文","益外昜"],cut:1},
 {t:0.854,dx:66,c:[[198,262,326],[160,232,302,376],[198,264,326]],g:["字無則","之昜則文","益外昜"]},
 {t:0.854,dx:73,c:[[160,233,305,378],[160,233,305,378],[160,233,305,378]],g:["佝林弃酌","育美談為","標樓香徵"],cut:1},
 {t:1.021,dx:73,c:[[160,233,305,378],[160,233,305,378],[160,233,305,378]],g:["佝林弃酌","育美談為","標樓香徵"]},
 {t:1.021,dx:73,c:[[160,233,305,378],[160,233,305,378],[160,233,305,378]],g:["登林不林","佝雖無富","竹樓之樓"],cut:1},
 {t:1.146,dx:73,c:[[160,233,305,378],[160,233,305,378],[160,233,305,378]],g:["登林不林","佝雖無富","竹樓之樓"]},
 {t:1.146,dx:73,c:[[160,233,305,378],[160,233,305,378],[160,233,305,378]],g:["醮佝等小","渠外不則","清標玩心"],cut:1},
 {t:1.1875,dx:73,c:[[160,233,305,378],[157,230,302,375],[160,233,305,378]],g:["醮佝等小","渠外不則","清標玩心"]},
 {t:1.271,dx:74,c:[[168,238,308,380],[128,200,272,346],[168,238,308,380]],g:["醮佝等小","渠外不則","清標玩心"]},
 {t:1.271,dx:75,c:[[185,250,320,385],[135,200,268,340,405],[180,245,315,385]],g:["樓談則酌","吾之昜則則","聽雖美徵"],cut:1},
 {t:1.333,dx:75,c:[[195,260,330,395],[118,192,262,338,428],[190,255,325,395]],g:["樓談則酌","吾之昜則則","聽雖美徵"]},
 {t:1.36,dx:75,c:[[198,263,333,398],[112,188,260,337,440],[193,258,328,398]],g:["樓談則酌","吾之昜則則","聽雖美徵"]},
];
function renderCont(t){const on=t>=0.646&&t<1.354;show(gCont,on);if(!on)return;
 let i=0;for(let k=0;k<CK.length;k++){if(CK[k].t<=t)i=k;}
 const A=CK[i],B=CK[i+1];let p=0;
 if(B&&!B.cut&&B.t>A.t){p=smooth(clamp((t-A.t)/(B.t-A.t),0,1));}
 const cs=[];const gl=[];
 for(let col=0;col<3;col++){const ya=A.c[col],yb=(B&&!B.cut)?B.c[col]:ya;const dx=A.dx+((B&&!B.cut?B.dx:A.dx)-A.dx)*p;
  const x=270+(col-1)*dx;
  for(let j=0;j<ya.length;j++){const y=ya[j]+((yb[j]??ya[j])-ya[j])*p;cs.push({x:x,y:y,r:37,R:41});gl.push(A.g[col][j]);}}
 cs.forEach((c,k)=>{set(contCs[k],{cx:c.x.toFixed(1),cy:c.y.toFixed(1)});show(contCs[k],true);show(contTs[k],true);const tx=contTs[k];set(tx,{transform:`translate(${c.x.toFixed(1)},${(c.y+1).toFixed(1)}) scale(1.16,0.9)`});tx.textContent=gl[k];});
 for(let k=cs.length;k<16;k++){show(contCs[k],false);show(contTs[k],false);}
 drawHull(contW,cs);}

// ================= LATTICE =================
const gLat=$("a3-g-lat");
const latCG=el("g",{},gLat);const latTG=el("g",{filter:"url(#a3-brush)"},gLat);
const LROWS=["字半酌半酌小談酌小談清字徵談清半","醮重種竹聽琴玩雀澆醮半酌小談清字","種樓茶茶登樓樓觀觀等種竹聽樓觀茶","衰標弃喜寓山林林香衰茶登樓標弃喜","樂佝佝樂吾吾若吾若十標標弃喜若吾","無無不昜美雖外之之食佝樂樂無不昜","竹樂吾若清小心種外昜談茶竹美心林","喜寓十半酌談佝樓觀種聽玩林標衰昜"];
const LC0=-5,LC1=11,LK0=-5,LK1=11;const lat=[];
for(let k=LK0;k<=LK1;k++)for(let c=LC0;c<=LC1;c++){const o={c:c,k:k};o.circ=el("circle",{r:51,fill:"#FE1700"},latCG);o.tx=el("text",{"class":"a3-cl","text-anchor":"middle","dominant-baseline":"central","font-size":80,fill:INK},latTG);o.last="";lat.push(o);}

function renderLat(t){const on=t>=1.354&&t<2.521;show(gLat,on);if(!on)return;
 const sx=111,sy=100.5,X0=48,Y0=17.5;
 const pv=clamp((t-1.354)/(1.56-1.354),0,1);const V=46*Math.pow(1-pv,3);
 const H=kf(HK,t),G=kf(GK,t);const th=kf(THK,t)*Math.PI/180,s=kf(SK,t),r=kf(RK,t);
 const ct=Math.cos(th),st=Math.sin(th),PX=263,PY=212;
 for(const o of lat){const dk=(((o.k%2)+2)%2)===0?1:-1;const dc=(((o.c%2)+2)%2)===0?-1:1;
  let x=X0+o.c*sx+dk*H,y=Y0+o.k*sy+dc*V;

}
